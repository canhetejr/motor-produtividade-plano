name: Reset temporário — Supabase de integração

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/resetar-integracao-canonicamente.yml'

permissions:
  contents: read

concurrency:
  group: reset-integracao-canonicamente
  cancel-in-progress: false

jobs:
  resetar:
    name: Reconstruir banco de integração pelas migrations canônicas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar alvo exclusivo de integração
        env:
          MCP_INTEGRATION_DB_URL: ${{ secrets.MCP_INTEGRATION_DB_URL }}
        run: |
          if [ -z "$MCP_INTEGRATION_DB_URL" ]; then
            echo "::error::MCP_INTEGRATION_DB_URL ausente. O reset não pode usar staging nem produção."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # A migration histórica 20260731100000 exige o primeiro administrador
      # legado. Em um banco de integração limpo essa conta não existe, então
      # construímos somente o ponto mínimo do Auth/public necessário ANTES de
      # aplicar essa migration. A senha é aleatória, efêmera e nunca logada.
      - name: Reconstruir base até antes do seed histórico de admin
        env:
          MCP_INTEGRATION_DB_URL: ${{ secrets.MCP_INTEGRATION_DB_URL }}
        run: >-
          npx --yes supabase db reset
          --db-url "$MCP_INTEGRATION_DB_URL"
          --version 20260730130000
          --no-seed
          --yes

      - name: Criar bootstrap Auth somente na integração
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.MCP_INTEGRATION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MCP_INTEGRATION_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'
          import { randomUUID } from 'node:crypto'

          const email = 'luizfernando.junior@unicive.edu.br'
          const admin = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { autoRefreshToken: false, persistSession: false },
          })
          const { data: list, error: listError } = await admin.auth.admin.listUsers({ page: 1, perPage: 1000 })
          if (listError) throw listError
          let user = list.users.find((item) => item.email?.toLowerCase() === email)
          if (!user) {
            const { data, error } = await admin.auth.admin.createUser({
              email,
              password: `${randomUUID()}-${randomUUID()}`,
              email_confirm: true,
            })
            if (error || !data.user) throw error ?? new Error('Auth não retornou o usuário técnico de integração')
            user = data.user
          }
          const { data: area, error: areaError } = await admin
            .from('areas')
            .insert({ nome: 'Bootstrap de Integração' })
            .select('id')
            .single()
          if (areaError || !area) throw areaError ?? new Error('Não criou a área técnica de integração')
          const { error: colaboradorError } = await admin
            .from('colaboradores')
            .upsert({
              id: user.id,
              nome: 'Bootstrap de Integração',
              area_id: area.id,
              role: 'gestor',
              ativo: true,
            }, { onConflict: 'id' })
          if (colaboradorError) throw colaboradorError
          console.log('Bootstrap histórico do banco de integração pronto.')
          NODE

      - name: Aplicar o restante das migrations canônicas
        env:
          MCP_INTEGRATION_DB_URL: ${{ secrets.MCP_INTEGRATION_DB_URL }}
        run: >-
          npx --yes supabase db push
          --db-url "$MCP_INTEGRATION_DB_URL"
          --skip-vault
          --yes

      - name: Provar histórico remoto igual ao canônico
        env:
          MCP_INTEGRATION_DB_URL: ${{ secrets.MCP_INTEGRATION_DB_URL }}
        run: |
          npx --yes supabase migration list --db-url "$MCP_INTEGRATION_DB_URL" > /tmp/migration-history.txt
          if grep -Eq '\| ` ` *\|' /tmp/migration-history.txt; then
            echo '::error::O histórico de migrations ainda diverge entre o banco de integração e o repositório.'
            exit 1
          fi
          tail -n 30 /tmp/migration-history.txt
