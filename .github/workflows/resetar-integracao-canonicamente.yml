name: Reset temporário — Supabase de integração

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/resetar-integracao-canonicamente.yml'

permissions:
  contents: read

concurrency:
  group: reset-integracao-canonicamente
  cancel-in-progress: false

jobs:
  resetar:
    name: Reconstruir banco de integração pelas migrations canônicas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar alvo exclusivo de integração
        env:
          MCP_INTEGRATION_DB_URL: ${{ secrets.MCP_INTEGRATION_DB_URL }}
        run: |
          if [ -z "$MCP_INTEGRATION_DB_URL" ]; then
            echo "::error::MCP_INTEGRATION_DB_URL ausente. O reset não pode usar staging nem produção."
            exit 1
          fi

      - name: Reconstruir base até antes do seed histórico de admin
        env:
          MCP_INTEGRATION_DB_URL: ${{ secrets.MCP_INTEGRATION_DB_URL }}
        run: >-
          npx --yes supabase db reset
          --db-url "$MCP_INTEGRATION_DB_URL"
          --version 20260730130000
          --no-seed
          --yes

      # A migration 20260731100000 mistura DDL canônico com um seed de um
      # administrador de produção. Aplicamos apenas seu prefixo de schema no
      # banco de integração limpo, verificamos que o seed foi removido e só
      # então registramos a versão. A migration no Git NÃO é editada.
      - name: Aplicar schema da migration histórica sem seed produtivo
        env:
          MCP_INTEGRATION_DB_URL: ${{ secrets.MCP_INTEGRATION_DB_URL }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          origem = Path('supabase/migrations/20260731100000_admin_global.sql').read_text()
          marcador = '-- SEED DO PRIMEIRO ADMIN'
          if origem.count(marcador) != 1:
            raise SystemExit('Marcador do seed histórico não é único; abortando.')
          prefixo = origem.split(marcador, 1)[0]
          if '\nbegin;\n' not in prefixo:
            raise SystemExit('Delimitador do bloco de seed não encontrado; abortando.')
          schema = prefixo.rsplit('\nbegin;\n', 1)[0].rstrip() + '\n'
          if 'luizfernando.junior@unicive.edu.br' in schema:
            raise SystemExit('O seed produtivo permaneceu no SQL temporário; abortando.')
          Path('/tmp/20260731100000_schema.sql').write_text(schema)
          PY
          psql "$MCP_INTEGRATION_DB_URL" -v ON_ERROR_STOP=1 -f /tmp/20260731100000_schema.sql
          npx --yes supabase migration repair --db-url "$MCP_INTEGRATION_DB_URL" --status applied 20260731100000 --yes

      - name: Aplicar o restante das migrations canônicas
        env:
          MCP_INTEGRATION_DB_URL: ${{ secrets.MCP_INTEGRATION_DB_URL }}
        run: >-
          npx --yes supabase db push
          --db-url "$MCP_INTEGRATION_DB_URL"
          --skip-vault
          --yes

      - name: Provar histórico remoto igual ao canônico
        env:
          MCP_INTEGRATION_DB_URL: ${{ secrets.MCP_INTEGRATION_DB_URL }}
        run: |
          npx --yes supabase migration list --db-url "$MCP_INTEGRATION_DB_URL" > /tmp/migration-history.txt
          if grep -Eq '\| ` ` *\|' /tmp/migration-history.txt; then
            echo '::error::O histórico de migrations ainda diverge entre o banco de integração e o repositório.'
            exit 1
          fi
          tail -n 30 /tmp/migration-history.txt
