# Passo 0 do docs/PLANO-MCP-PRODUTO.md — esteira de CI mínima dedicada à suíte
# de isolamento MCP. Não substitui `npm test`/`lint`/`build` locais antes de
# cada deploy (ver "Validação final e publicação" no plano); só cobre a
# suíte de __tests__/isolamento contra um banco de integração real.
#
# As credenciais do projeto Supabase EXCLUSIVO de integração ficam em secrets
# MCP_INTEGRATION_* no GitHub. Este workflow falha de propósito se qualquer
# uma estiver ausente: não é permitido transformar a prova real em skip.
#
# Nomes de secret prefixados com MCP_INTEGRATION_ (em vez de reusar
# NEXT_PUBLIC_SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY como nome de secret) de
# propósito: evita qualquer ambiguidade no painel do GitHub entre a
# credencial do banco de integração e uma futura credencial de produção.
name: MCP — suíte de isolamento (integração)

on:
  workflow_dispatch: {}
  # O item 0.3.1 do plano deixava em aberto se o gatilho seria `push` ou
  # `pull_request`, à espera de confirmar como o repositório trabalha de fato.
  # Confirmado: a validação ocorre por PR antes do merge. O push em `develop`
  # e `main` mantém uma verificação pós-promoção para staging e produção.
  #
  # Os secrets do banco de integração ficam disponíveis para PR do próprio
  # repositório; PR vindo de fork não os recebe, e nesse caso o job falha no
  # passo "Verificar credenciais" — que é o comportamento correto por 0.1.3
  # (nunca pular em silêncio), e o sinal de que aquele PR precisa de uma
  # execução manual por alguém com acesso.
  pull_request:
    branches: [develop, main]
    paths:
      - 'lib/mcp/**'
      - 'lib/mcp-auth.ts'
      - 'lib/mcp-escopos.ts'
      - 'app/api/mcp/**'
      - 'supabase/migrations/**mcp**'
      - '__tests__/isolamento/**'
      - '.github/workflows/mcp-integracao.yml'
  push:
    branches: [develop, main]
    paths:
      - 'lib/mcp/**'
      - 'lib/mcp-auth.ts'
      - 'lib/mcp-escopos.ts'
      - 'app/api/mcp/**'
      - 'supabase/migrations/**mcp**'
      - '__tests__/isolamento/**'
      - '.github/workflows/mcp-integracao.yml'

jobs:
  isolamento:
    name: Suíte de isolamento (__tests__/isolamento) contra banco de integração
    runs-on: ubuntu-latest
    # Placeholder até a suíte real (Gate 1) existir e ter tempo medido —
    # ver 0.3.4. Curto de propósito para não mascarar um teste travado.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # Roda ANTES da suíte de banco e sem credencial nenhuma: os testes de
      # escrita MCP em lib/mcp/mutations.test.ts (idempotência, escopo, filtro
      # de organização) não dependem de Postgres, e falhar neles é mais barato
      # e mais legível do que falhar depois, no meio de fixtures reais.
      - name: Testes unitários do servidor MCP (sem banco)
        run: npm test -- lib/mcp

      - name: Verificar credenciais do banco de integração
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.MCP_INTEGRATION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MCP_INTEGRATION_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MCP_INTEGRATION_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::MCP_INTEGRATION_SUPABASE_URL, MCP_INTEGRATION_SERVICE_ROLE_KEY e/ou MCP_INTEGRATION_SUPABASE_ANON_KEY ausentes dos secrets do repositório. O job não pode pular a prova real de isolamento."
            exit 1
          fi

      - name: Suíte de isolamento (inclui a suíte real de integração quando o Gate 1 existir)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.MCP_INTEGRATION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MCP_INTEGRATION_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MCP_INTEGRATION_SUPABASE_ANON_KEY }}
        run: npm test -- __tests__/isolamento
